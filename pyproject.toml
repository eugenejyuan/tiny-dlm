[project]
name = "tiny-dlm"
version = "0.1.0"
description = "A personal playground for learning and experimenting with diffusion LMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "einops>=0.8",
    "regex>=2024.5.15",      # \p{L} pretokenization pattern; stdlib `re` cannot do it
    "numpy>=2.0",            # uint16 token bins + np.memmap batching
    "tqdm>=4.66",            # progress for the two slow steps: fetching and BPE training
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinydlm"]

[tool.ruff]
line-length = 100
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
